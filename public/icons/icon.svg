<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311006"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 12" opacity="0.3"/>

  <!-- Compass Cardinal Points (N, S, E, W) -->
  <polygon points="256,76 270,106 242,106" fill="url(#goldGrad)"/>
  <polygon points="256,436 270,406 242,406" fill="url(#goldGrad)"/>
  <polygon points="76,256 106,242 106,270" fill="url(#goldGrad)"/>
  <polygon points="436,256 406,242 406,270" fill="url(#goldGrad)"/>

  <!-- Glowing Flame / Adventure Symbol -->
  <g filter="url(#glow)">
    <!-- Dynamic Compass Needle / Arrow -->
    <polygon points="256,120 300,256 256,236" fill="url(#primaryGrad)"/>
    <polygon points="256,120 212,256 256,236" fill="#fb923c"/>
    <polygon points="256,392 300,256 256,276" fill="#475569"/>
    <polygon points="256,392 212,256 256,276" fill="#334155"/>
  </g>

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="28" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="12" fill="url(#primaryGrad)"/>

  <!-- Text "PECHINO BRA" -->
  <text x="256" y="468" font-family="'Bebas Neue', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
    PECHINO EXPRESS BRA
  </text>
</svg>